services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: sqlite+aiosqlite:////app/data/bot.db
      REDIS_URL: redis://redis:6379/0
      INSTANCE_LOCK_PATH: /app/data/bot-instance.lock
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - botdata:/app/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data

volumes:
  botdata:
  redisdata:
